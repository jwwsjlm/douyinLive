services:
  douyinlive:
    image: ghcr.io/jwwsjlm/douyinlive:latest
    container_name: douyinlive
    restart: unless-stopped
    ports:
      - "1088:1088"
    volumes:
      - ./data:/app/data
    command: ["--config", "/app/data/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:1088/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
