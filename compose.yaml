services:
  douyinlive:
    image: ghcr.io/jwwsjlm/douyinlive:latest
    container_name: douyinlive
    restart: unless-stopped
    ports:
      - "1088:1088"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 1088 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
